name: Auto Update Texas Lotto CSV

on:
  schedule:
    # Runs Mon, Wed, Sat at 10:30 PM CT & 11:30 PM CT
    - cron: '30 3 * * 0,2,4'
    - cron: '30 4 * * 0,2,4'
  workflow_dispatch: # Allows manual 1-click trigger anytime on GitHub!

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Fetch Script
        run: |
          python update_draws.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lottotexas.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Texas Lotto draws" && git push)

      - name: Upload updated CSV to Cloudflare R2
        run: |
          pip install awscli
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws s3 cp lottotexas.csv s3://quickhits-data/lottotexas.csv --endpoint-url ${{ secrets.R2_ENDPOINT }}
